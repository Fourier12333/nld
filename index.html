<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NLD">
<title>NLD Épargne</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0E1A;color:#E8EDF7;font-family:-apple-system,sans-serif;min-height:100vh}
.badge{display:inline-block;background:rgba(0,201,167,.12);border:1px solid rgba(0,201,167,.3);border-radius:20px;padding:4px 16px;letter-spacing:4px;font-size:13px;color:#00C9A7;font-family:monospace;margin-bottom:14px}
.header{background:linear-gradient(160deg,#0D1B3E,#0A0E1A);border-bottom:1px solid #1E2D4A;padding:50px 20px 22px;text-align:center}
.total{font-size:34px;font-weight:900;margin:6px 0 14px}
.prog{background:#1E2D4A;border-radius:8px;height:7px;margin:0 20px}
.prog-fill{height:7px;border-radius:8px;background:linear-gradient(90deg,#00C9A7,#3D7EFF);transition:width 1s}
.sub{color:#6B7A99;font-size:12px;margin-top:7px}
.content{padding:18px 16px 80px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.title{font-size:18px;font-weight:800}
.btn-new{background:linear-gradient(135deg,#00C9A7,#3D7EFF);border:none;border-radius:22px;padding:8px 20px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.card{background:#131929;border:1px solid #1E2D4A;border-radius:20px;padding:18px;margin-bottom:14px;cursor:pointer}
.card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-left{display:flex;align-items:center;gap:12px}
.icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.card-name{font-weight:700;font-size:16px}
.card-obj{color:#6B7A99;font-size:12px}
.card-amount{font-weight:800;font-size:18px}
.card-pct{font-size:12px;color:#6B7A99}
.card-bar{background:#1E2D4A;border-radius:6px;height:6px;margin-bottom:7px}
.card-bar-fill{height:6px;border-radius:6px;transition:width 1s}
.card-rest{font-size:12px;color:#6B7A99}
.empty{text-align:center;padding:60px 20px;color:#6B7A99}
.empty-icon{font-size:56px;margin-bottom:14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99;display:flex;align-items:flex-end}
.modal{background:#131929;border-radius:28px 28px 0 0;padding:20px 20px 40px;width:100%;max-height:90vh;overflow-y:auto}
.pill{width:44px;height:5px;background:#1E2D4A;border-radius:4px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:18px}
input{width:100%;background:#1A2540;border:1.5px solid #1E2D4A;border-radius:12px;padding:13px 14px;color:#E8EDF7;font-size:15px;outline:none;font-family:inherit;margin-bottom:10px}
input:focus{border-color:#00C9A7}
input::placeholder{color:#6B7A99}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn-cancel{flex:1;padding:13px 0;background:#1A2540;border:1px solid #1E2D4A;border-radius:14px;color:#6B7A99;font-weight:700;cursor:pointer;font-family:inherit}
.btn-ok{flex:2;padding:13px 0;background:linear-gradient(135deg,#00C9A7,#3D7EFF);border:none;border-radius:14px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.lbl{color:#6B7A99;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.emojis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ej{width:44px;height:44px;border-radius:12px;font-size:22px;cursor:pointer;background:#1A2540;border:1px solid #1E2D4A}
.ej.sel{background:rgba(0,201,167,.2);border:2px solid #00C9A7}
.colors{display:flex;gap:10px;margin-bottom:18px}
.col{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.col.sel{border-color:#fff;transform:scale(1.2)}
.tx-row{display:flex;gap:8px;margin-bottom:16px}
.tx-btn{flex:1;padding:12px 0;border-radius:13px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.detail-header{padding:50px 20px 20px;border-bottom:1px solid #1E2D4A}
.back{background:none;border:none;color:#6B7A99;font-size:30px;cursor:pointer;line-height:1}
.detail-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.arc-wrap{position:relative;flex-shrink:0}
.arc-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#131929;border:1px solid #1E2D4A;border-radius:14px;padding:13px 14px}
.stat-l{color:#6B7A99;font-size:11px;margin-bottom:4px}
.stat-v{font-weight:800;font-size:16px}
.tabs{display:flex;background:#1A2540;border-radius:14px;padding:4px;margin:14px 16px}
.tab{flex:1;padding:10px 0;border-radius:11px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tx-item{display:flex;justify-content:space-between;align-items:center;background:#131929;border:1px solid #1E2D4A;border-radius:14px;padding:13px 14px;margin-bottom:10px}
.tx-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-right:10px}
.btn-del{width:100%;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3);border-radius:14px;padding:13px 0;color:#FF5A5F;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;font-family:inherit}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);background:#00C9A7;color:#0A0E1A;padding:10px 22px;border-radius:40px;font-weight:700;font-size:14px;z-index:200;white-space:nowrap;opacity:0;transition:all .3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const EMOJIS=['💰','🎓','✈️','🏠','🚗','⚡','🎯','🏥','💼','📱','📚','🛍️','💻','🌍','🎵'];
const COLS=['#3D7EFF','#00C9A7','#F5C542','#FF5A5F','#A855F7','#F97316'];
const gid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n))+' FCFA';
const now=()=>new Date().toISOString().slice(0,10);
let data=[];
try{data=JSON.parse(localStorage.getItem('nld5')||'[]');}catch{}
const save=()=>{try{localStorage.setItem('nld5',JSON.stringify(data));}catch{}};
let view='home',sid=null,tab='ap',mod=null,mE='💰',mC='#3D7EFF',mN='',mO='',tT='depot',tM='',tN='';
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);};
const pct=(s,o)=>o>0?Math.min(100,Math.round(s/o*100)):0;

function arc(p,c){
  const r=42,ci=2*Math.PI*r,d=p/100*ci;
  return`<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="#1E2D4A" stroke-width="9"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-dasharray="${d.toFixed(1)} ${ci.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 48 48)"/></svg>`;
}

function render(){
  let html='';
  if(view==='home'){
    const ts=data.reduce((a,c)=>a+c.s,0),to=data.reduce((a,c)=>a+c.o,0),gp=pct(ts,to);
    html=`<div class="header"><div class="badge">N · L · D</div><div style="color:#6B7A99;font-size:11px;letter-spacing:2px;text-transform:uppercase">Épargne totale</div><div class="total">${fmt(ts)}</div><div class="prog"><div class="prog-fill" style="width:${gp}%"></div></div><div class="sub">${gp}% de ${fmt(to)} atteint</div></div>
    <div class="content"><div class="row"><span class="title">Mes Caisses</span><button class="btn-new" onclick="openMod('new')">+ Nouvelle</button></div>
    ${data.length?data.map(c=>`<div class="card" onclick="go('${c.id}')"><div class="card-row"><div class="card-left"><div class="icon" style="background:${c.c}22;border:1.5px solid ${c.c}55">${c.e}</div><div><div class="card-name">${c.n}</div><div class="card-obj">Objectif : ${fmt(c.o)}</div></div></div><div style="text-align:right"><div class="card-amount" style="color:${c.c}">${fmt(c.s)}</div><div class="card-pct" style="color:${pct(c.s,c.o)>=100?'#00C9A7':'#6B7A99'}">${pct(c.s,c.o)}%</div></div></div><div class="card-bar"><div class="card-bar-fill" style="width:${pct(c.s,c.o)}%;background:${c.c}"></div></div><div class="card-rest" style="color:${c.s>=c.o?'#00C9A7':'#6B7A99'}">${c.s>=c.o?'🎉 Objectif atteint !':'Reste '+fmt(c.o-c.s)}</div></div>`).join(''):`<div class="empty"><div class="empty-icon">💰</div><p>Créez votre première caisse !</p></div>`}
    </div>`;
  } else {
    const c=data.find(x=>x.id===sid);
    if(!c){view='home';render();return;}
    const p=pct(c.s,c.o);
    const td=c.t.filter(x=>x.tp==='d').reduce((a,x)=>a+x.m,0);
    const tr=c.t.filter(x=>x.tp==='r').reduce((a,x)=>a+x.m,0);
    html=`<div class="detail-header" style="background:linear-gradient(160deg,${c.c}20,#0A0E1A 65%)"><div class="detail-top"><button class="back" onclick="view='home';render()">‹</button><span style="font-size:28px">${c.e}</span><div><div style="font-weight:800;font-size:19px">${c.n}</div><div style="color:#6B7A99;font-size:12px">Objectif : ${fmt(c.o)}</div></div></div>
    <div style="display:flex;align-items:center;gap:18px"><div class="arc-wrap">${arc(p,c.c)}<div class="arc-label" style="color:${c.c}">${p}%</div></div>
    <div><div style="color:#6B7A99;font-size:12px;margin-bottom:3px">Solde actuel</div><div style="font-size:26px;font-weight:900">${fmt(c.s)}</div><div style="font-size:12px;color:${c.s<c.o?'#6B7A99':'#00C9A7'};margin-top:4px">${c.s<c.o?'Encore '+fmt(c.o-c.s)+' à épargner':'🎉 Objectif atteint !'}</div></div></div></div>
    <div class="tabs"><button class="tab" style="background:${tab==='ap'?c.c:'transparent'};color:${tab==='ap'?'#fff':'#6B7A99'}" onclick="tab='ap';render()">📊 Aperçu</button><button class="tab" style="background:${tab==='tx'?c.c:'transparent'};color:${tab==='tx'?'#fff':'#6B7A99'}" onclick="tab='tx';render()">📋 Historique</button></div>
    <div style="padding:0 16px 80px">
    ${tab==='ap'?`<div class="stats"><div class="stat"><div class="stat-l">Dépôts</div><div class="stat-v" style="color:#00C9A7">${fmt(td)}</div></div><div class="stat"><div class="stat-l">Retraits</div><div class="stat-v" style="color:#FF5A5F">${fmt(tr)}</div></div><div class="stat"><div class="stat-l">Opérations</div><div class="stat-v" style="color:#3D7EFF">${c.t.length}</div></div><div class="stat"><div class="stat-l">Reste</div><div class="stat-v" style="color:#F5C542">${fmt(Math.max(0,c.o-c.s))}</div></div></div>
    <button class="btn-del" onclick="delC('${c.id}')">🗑 Supprimer cette caisse</button>`
    :`<button class="btn-new" style="width:100%;border-radius:14px;padding:14px;margin-bottom:14px;font-size:15px" onclick="openMod('tx')">+ Ajouter une opération</button>
    ${c.t.length?[...c.t].reverse().map(t=>`<div class="tx-item"><div style="display:flex;align-items:center"><div class="tx-icon" style="background:${t.tp==='d'?'rgba(0,201,167,.15)':'rgba(255,90,95,.15)'}">${t.tp==='d'?'⬇️':'⬆️'}</div><div><div style="font-weight:600;font-size:14px">${t.n}</div><div style="color:#6B7A99;font-size:11px">${t.d}</div></div></div><div style="color:${t.tp==='d'?'#00C9A7':'#FF5A5F'};font-weight:800;font-size:15px">${t.tp==='d'?'+':'-'}${fmt(t.m)}</div></div>`).join(''):'<p style="text-align:center;color:#6B7A99;padding:40px 0">Aucune opération</p>'}
    `}
    </div>`;
  }

  // Modals
  if(mod==='new'){
    html+=`<div class="modal-bg" onclick="if(event.target.className==='modal-bg'){mod=null;render()}"><div class="modal"><div class="pill"></div><div class="modal-title">✨ Nouvelle Caisse</div>
    <div class="lbl">Icône</div><div class="emojis">${EMOJIS.map(e=>`<button class="ej${mE===e?' sel':''}" onclick="mE='${e}';render()">${e}</button>`).join('')}</div>
    <div class="lbl">Couleur</div><div class="colors">${COLS.map(cl=>`<button class="col${mC===cl?' sel':''}" style="background:${cl}" onclick="mC='${cl}';render()"></button>`).join('')}</div>
    <input placeholder="Nom de la caisse" value="${mN}" oninput="mN=this.value">
    <input type="number" placeholder="Objectif en FCFA" value="${mO}" oninput="mO=this.value">
    <div class="btn-row"><button class="btn-cancel" onclick="mod=null;render()">Annuler</button><button class="btn-ok" onclick="creer()">Créer</button></div>
    </div></div>`;
  } else if(mod==='tx'){
    html+=`<div class="modal-bg" onclick="if(event.target.className==='modal-bg'){mod=null;render()}"><div class="modal"><div class="pill"></div><div class="modal-title">💳 Nouvelle Opération</div>
    <div class="tx-row"><button class="tx-btn" style="background:${tT==='depot'?'#00C9A7':'#1A2540'};color:${tT==='depot'?'#fff':'#6B7A99'}" onclick="tT='depot';render()">💰 Dépôt</button><button class="tx-btn" style="background:${tT==='retrait'?'#FF5A5F':'#1A2540'};color:${tT==='retrait'?'#fff':'#6B7A99'}" onclick="tT='retrait';render()">📤 Retrait</button></div>
    <input type="number" placeholder="Montant en FCFA" value="${tM}" oninput="tM=this.value">
    <input placeholder="Note (ex: Salaire, Bourse...)" value="${tN}" oninput="tN=this.value">
    <div class="btn-row"><button class="btn-cancel" onclick="mod=null;render()">Annuler</button><button class="btn-ok" style="background:${tT==='depot'?'#00C9A7':'#FF5A5F'}" onclick="ajTx()">Enregistrer</button></div>
    </div></div>`;
  }

  document.getElementById('root').innerHTML=html;
}

function go(id){sid=id;tab='ap';view='detail';render();}
function openMod(m){mod=m;render();}
function creer(){
  if(!mN.trim()){toast('❌ Entrez un nom');return;}
  const o=parseInt(mO);if(!o||o<=0){toast('❌ Objectif invalide');return;}
  data.push({id:gid(),n:mN.trim(),o,s:0,c:mC,e:mE,t:[]});
  save();mN='';mO='';mod=null;render();toast('✅ Caisse créée !');
}
function ajTx(){
  const m=parseInt(tM);if(!m||m<=0){toast('❌ Montant invalide');return;}
  const nt=tN.trim()||(tT==='depot'?'Dépôt':'Retrait');
  data=data.map(c=>{if(c.id!==sid)return c;const d=tT==='depot'?m:-m;return{...c,s:Math.max(0,c.s+d),t:[...c.t,{id:gid(),tp:tT==='depot'?'d':'r',m,n:nt,d:now()}]};});
  save();tM='';tN='';mod=null;render();toast(tT==='depot'?'✅ Dépôt enregistré !':'✅ Retrait enregistré');
}
function delC(id){
  if(!confirm('Supprimer cette caisse ?'))return;
  data=data.filter(c=>c.id!==id);save();view='home';sid=null;render();toast('Caisse supprimée');
}
render();
</script>
</body>
</html>
